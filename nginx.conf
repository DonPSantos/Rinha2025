worker_processes 1;
worker_priority -5;
pcre_jit on;

events {
    worker_connections 512;
    use epoll;
    multi_accept on;
    accept_mutex on;
}

http {
    # Otimizações básicas
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    
    # Keepalive reduzido para liberar recursos mais rapidamente
    keepalive_timeout 10;
    keepalive_requests 50;
    
    # Buffers mínimos para economizar memória
    client_body_buffer_size 8K;
    client_header_buffer_size 1k;
    client_max_body_size 2m;
    large_client_header_buffers 2 4k;
    
    # Timeouts agressivos para liberar conexões rapidamente
    client_body_timeout 5;
    client_header_timeout 5;
    reset_timedout_connection on;
    
    # Desativa recursos que consomem memória
    open_file_cache off;
    gzip off;

    upstream api { 
        server api-1:8080;
        server api-2:8080;
        keepalive 16;
     }

    server {
        listen 9999;
        
        # Desativa recursos desnecessários
        proxy_buffering off;
        access_log off;

        location / {
            proxy_pass http://api;

            # Timeouts curtos
            proxy_connect_timeout 3s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            
            # HTTP version
            proxy_http_version 1.1;
            
            # Headers mínimos essenciais
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # Comportamento de failover simplificado
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }

        # Bloqueia acesso a recursos desnecessários
        location ~ /\.ht {
            deny all;
        }
    }

        # Logging mínimo
    error_log /var/log/nginx/error.log error;
    
    # Cache de DNS mínimo
    resolver 127.0.0.1 valid=30s;
}