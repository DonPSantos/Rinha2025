services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backnet
    depends_on:
      - api-1
      - api-2
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.25"
    #       memory: "20MB"

  api-1:
    build:
      context: ./Rinha2025
    container_name: api-1
    ports:
      - "7001:8080"
    networks:
      - backnet
      - payment-processor
    environment:
      - PROCESSOR_DEFAULT_URL=http://payment-processor-default:8080
      - PROCESSOR_FALLBACK_URL=http://payment-processor-fallback:8080
      - WORKER_NAME=POTATO
      - REDIS_CONNECTION=redis:6379,abortConnect=false
      - DB_PATH=/Data/mydb.db
    volumes:
      - api-1_data:/data
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: "150MB"

  api-2:
    build:
      context: ./Rinha2025
    container_name: api-2
    ports:
      - "7002:8080"
    networks:
      - backnet
      - payment-processor
    environment:
      - PROCESSOR_DEFAULT_URL=http://payment-processor-default:8080
      - PROCESSOR_FALLBACK_URL=http://payment-processor-fallback:8080
      - WORKER_NAME=TOMATO
      - REDIS_CONNECTION=redis:6379,abortConnect=false
      - DB_PATH=/Data/mydb.db
    volumes:
      - api-2_data:/data
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: "150MB"

networks:
  backnet:
    driver: bridge
  payment-processor:
    external: true

volumes:
  api-1_data:
  api-2_data:
