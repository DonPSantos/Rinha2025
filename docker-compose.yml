services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - backnet
    depends_on:
      - api-1
      - api-2
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.25"
    #       memory: "20MB"

  api-1:
    build:
      context: ./Rinha2025
    container_name: api-1
    ports:
      - "7001:8080"
    networks:
      - backnet
      - payment-processor
    environment:
      - PROCESSOR_DEFAULT_URL=http://payment-processor-default:8080
      - PROCESSOR_FALLBACK_URL=http://payment-processor-fallback:8080
      - WORKER_NAME=POTATO
      - REDIS_CONNECTION=redis:6379,abortConnect=false
    depends_on:
      - redis
      - rabbitmq
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: "150MB"

  api-2:
    build:
      context: ./Rinha2025
    container_name: api-2
    ports:
      - "7002:8080"
    networks:
      - backnet
      - payment-processor
    environment:
      - PROCESSOR_DEFAULT_URL=http://payment-processor-default:8080
      - PROCESSOR_FALLBACK_URL=http://payment-processor-fallback:8080
      - WORKER_NAME=TOMATO
      - REDIS_CONNECTION=redis:6379,abortConnect=false
    depends_on:
      - redis
      - rabbitmq
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: "150MB"

  redis:
    image: redis:alpine
    container_name: redis
    command: redis-server --save "" --appendonly no --maxclients 20000
    ports:
      - "6379:6379"
    networks:
      - backnet
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.25"
    #       memory: "30MB"

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: rabbitmq
    hostname: host-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_NODENAME: rabbit@host-rabbit
    networks:
      - backnet
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 30s
      retries: 5

networks:
  backnet:
    driver: bridge
  payment-processor:
    external: true
